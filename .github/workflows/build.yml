name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PyGObject and WebKitGTK come from the distro, so tests use the system Python.
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 librsvg2-common python3-pytest
      - run: python3 -m pytest -q

  test-windows:
    # The tray (pystray), single-instance pipe and WebView2 backend only run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: python -m pytest -q

  draft:
    # For a tag like v1.2.3: a draft release the package jobs attach their files to.
    # (Files go straight to the release, not to Actions artifact storage, whose quota is
    # shared by every private repo and runs out.)
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Check the tag matches the app version
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('natter/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match natter.__version__ ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ## Install

          **Debian / Ubuntu:** `sudo apt install ./natter_*_all.deb`. Natter appears in your app
          menu, or run `natter`. It uses the system WebKitGTK, so the package is tiny.

          **Windows:** download `Natter-…-windows-x64-setup.exe` and run it. It installs Natter
          for your user (no admin needed), adds it to the Start menu and to Settings → Apps for
          uninstalling, and upgrades an older install in place without logging you out. It uses
          the WebView2 runtime built into Windows 10/11. It isn't code-signed, so SmartScreen
          may warn you: choose *More info → Run anyway*.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Natter $VERSION" \
              --notes-file notes.md
          fi

  package:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: --deb
            files: dist/*.deb
          - os: windows-latest
            build: --installer
            files: dist/*-setup.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        run: pip install -e ".[build]"
      - if: runner.os == 'Windows'
        name: Install Inno Setup (if the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: python scripts/build.py ${{ matrix.build }}
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber

  release:
    # Pushing a tag like v1.2.3 publishes that version's .deb and .exe once both are attached.
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
