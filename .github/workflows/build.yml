name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PyGObject and WebKitGTK come from the distro, so tests use the system Python.
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 librsvg2-common python3-pytest
      - run: python3 -m pytest -q

  test-windows:
    # The tray (pystray), single-instance pipe and WebView2 backend only run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: python -m pytest -q

  package:
    needs: [test, test-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: --deb
            artifact: dist/*.deb
          - os: windows-latest
            build: --installer
            artifact: dist/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        run: pip install -e ".[build]"
      - if: runner.os == 'Windows'
        name: Install Inno Setup (if the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: python scripts/build.py ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: Natter-${{ runner.os }}
          path: ${{ matrix.artifact }}

  release:
    # Pushing a tag like v1.2.3 publishes that version's .deb and .exe.
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('natter/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match natter.__version__ ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ## Install

          **Debian / Ubuntu:** `sudo apt install ./natter_*_all.deb`. Natter appears in your app
          menu, or run `natter`. It uses the system WebKitGTK, so the package is tiny.

          **Windows:** download `Natter-…-windows-x64-setup.exe` and run it. It installs Natter
          for your user (no admin needed), adds it to the Start menu and to Settings → Apps for
          uninstalling, and upgrades an older install in place without logging you out. It uses
          the WebView2 runtime built into Windows 10/11. It isn't code-signed, so SmartScreen
          may warn you: choose *More info → Run anyway*.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Natter $VERSION" \
            --notes-file notes.md artifacts/Natter-Linux/*.deb artifacts/Natter-Windows/*-setup.exe
